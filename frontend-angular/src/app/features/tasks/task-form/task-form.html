<section class="task-form-panel">
  <div class="form-heading">
    <div>
      <p class="form-label">New item</p>
      <h2>Create a task</h2>
    </div>

    <p>Add something you want to complete.</p>
  </div>

  <form
    class="task-form"
    [formGroup]="form"
    (ngSubmit)="submit()"
  >
    <label class="form-field form-field--wide">
      <span>Title</span>

      <input
        type="text"
        formControlName="title"
        maxlength="150"
        placeholder="Example: Study Angular signals"
      />

      @if (
        form.controls.title.touched &&
        form.controls.title.hasError('required')
      ) {
        <small class="field-error">
          Task title is required.
        </small>
      }

      @if (
        form.controls.title.touched &&
        form.controls.title.hasError('maxlength')
      ) {
        <small class="field-error">
          Task title cannot exceed 150 characters.
        </small>
      }
    </label>

    <label class="form-field form-field--wide">
      <span>Description</span>

      <textarea
        formControlName="description"
        maxlength="1000"
        rows="3"
        placeholder="Add optional details"
      ></textarea>

      @if (
        form.controls.description.touched &&
        form.controls.description.hasError('maxlength')
      ) {
        <small class="field-error">
          Description cannot exceed 1000 characters.
        </small>
      }
    </label>

    <label class="form-field">
      <span>Due date</span>

      <input
        type="datetime-local"
        formControlName="dueDate"
      />
    </label>

    <label class="form-field">
      <span>Category</span>

      <select formControlName="categoryId">
        @for (
          category of categories();
          track category.id
        ) {
          <option [value]="category.id">
            {{ category.name }}
          </option>
        }
      </select>

      @if (
        form.controls.categoryId.touched &&
        form.controls.categoryId.hasError('required')
      ) {
        <small class="field-error">
          A category is required.
        </small>
      }
    </label>

    @if (error()) {
      <p class="form-error" role="alert">
        {{ error() }}
      </p>
    }

    <div class="form-actions">
      <button
        class="submit-button"
        type="submit"
        [disabled]="isSubmitting()"
      >
        {{
          isSubmitting()
            ? 'Creating...'
            : 'Create task'
        }}
      </button>
    </div>
  </form>
</section>
